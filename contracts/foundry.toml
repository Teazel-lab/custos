[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false

# Install from this directory (not vendored):
# forge install foundry-rs/forge-std@v1.17.0 --no-git

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

# Etherscan API V2. One Etherscan key covers chain 56 and chain 97.
# https://api.etherscan.io/v2/api?chainid=<chainId>
[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56, url = "https://api.etherscan.io/v2/api?chainid=56" }
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97, url = "https://api.etherscan.io/v2/api?chainid=97" }
